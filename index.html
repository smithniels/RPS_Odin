<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">

    <title>Rock, Paper, & Scissors</title>

<!-- <header>R vs P vs S</header> -->
<!-- 🗿📄✂️ -->
<header>Rock, Paper, Scissors</header>

<body>
    <div class='container'>
        <Button class="start" onClick="startGame()"> Start Game </Button>
    </div>
    <div class="menu gamebackground">
        <div class="buttonBox">
            <Button onclick="rock()" id="rock">🗿</Button>
            <Button onclick="paper()" id="paper">📄</Button>
            <Button onclick="scissor()" id="scissor">✂️</Button>
        </div>
        <div class="lower">
            <button onClick="reset()" class="reset">reset</button>
            <div id="scoreboard">#</div>
            <div id="selector">#</div>
            <div id="robot">#</div>
        </div>


        <div class="roboMoves">
            <p>Robot chooses...</p>
        </div>
    </div>





</body>

</html>
