<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <script src="./script.js"></script>
    <title>Rock, Paper, & Scissors</title>
</head>
<header>Rock 🗿, Paper 📄, Scissors ✂️</header>

<body>
    <div class='container'><!-- everything goes in this container -->
        <Button class="start" onClick="startGame()"> Start Game </Button>
        <!-- <div id="scoreboard">#</div> -->
        <div class="menu gamebackground">
            <div class="buttonBox">
                <Button onclick="rock()" id="rock">🗿</Button>
                <Button onclick="paper()" id="paper">📄</Button>
                <Button onclick="scissors()" id="scissors">✂️</Button>
            </div>
            <div class="lower">
            </div>
            <div class="userMoves">
                <p> User chooses...</p>
                <div id="selector"></div>
            </div>
            <div class="roboMoves">
                <p>Robot chooses...</p>
                <div id="robot"></div>
            </div>
            <div class="result"></div>
            <div id="result-display"></div>
        </div>
        <button onClick="reset()" class="reset">reset</button>
    </div>
    </div>




</body>

</html>
